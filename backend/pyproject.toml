[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "fastembed>=0.7.0",
    "pgvector>=0.4.0",
    "pypdf>=6.0.0",
    "python-multipart>=0.0.20",
    "alembic>=1.13.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "email-validator>=2.2.0",
    "psycopg[binary]>=3.2.0",
    "psycopg2-binary>=2.9.9",
    "rq==2.12.0",
    "redis>=5,<7",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
