services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: pgvector/pgvector:pg16
    container_name: knowledge_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: knowledge_platform
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knowledge_platform_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/knowledge_platform
      SECRET_KEY: ${SECRET_KEY:?Set a generated SECRET_KEY in the root .env file}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      UPLOAD_DIR: /data/uploads
      EMBEDDING_CACHE_DIR: /data/models
      REDIS_URL: redis://redis:6379/0
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      EMBEDDING_CACHE_TTL_SECONDS: ${EMBEDDING_CACHE_TTL_SECONDS:-86400}
      RETRIEVAL_CACHE_TTL_SECONDS: ${RETRIEVAL_CACHE_TTL_SECONDS:-300}
      CHAT_CACHE_TTL_SECONDS: ${CHAT_CACHE_TTL_SECONDS:-300}
      CACHE_MAX_VALUE_BYTES: ${CACHE_MAX_VALUE_BYTES:-524288}
      CACHE_MODEL_PRICES_JSON: ${CACHE_MODEL_PRICES_JSON:-{}}
      RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-ingestion}
      RQ_JOB_TIMEOUT: ${RQ_JOB_TIMEOUT:-900}
      INGESTION_MAX_ATTEMPTS: ${INGESTION_MAX_ATTEMPTS:-3}
      RESEARCH_MAX_ATTEMPTS: ${RESEARCH_MAX_ATTEMPTS:-3}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://localhost:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-}
      CHAT_MODEL: ${CHAT_MODEL:-}
      RESEARCH_PLAN_PROVIDER: ${RESEARCH_PLAN_PROVIDER:-}
      RESEARCH_PLAN_MODEL: ${RESEARCH_PLAN_MODEL:-}
      RESEARCH_DRAFT_PROVIDER: ${RESEARCH_DRAFT_PROVIDER:-}
      RESEARCH_DRAFT_MODEL: ${RESEARCH_DRAFT_MODEL:-}
      MODEL_FALLBACK_PROVIDER: ${MODEL_FALLBACK_PROVIDER:-}
      MODEL_FALLBACK_MODEL: ${MODEL_FALLBACK_MODEL:-}
      GATEWAY_MAX_ATTEMPTS: ${GATEWAY_MAX_ATTEMPTS:-2}
      GATEWAY_RETRY_BASE_SECONDS: ${GATEWAY_RETRY_BASE_SECONDS:-0.5}
      OPENAI_TOKEN_LIMIT_FIELD: ${OPENAI_TOKEN_LIMIT_FIELD:-max_tokens}
      RAG_RETRIEVAL_METHOD: ${RAG_RETRIEVAL_METHOD:-vector}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-local}
      OTEL_SERVICE_NAME: ai-knowledge-api
    volumes:
      - ingestion_data:/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/knowledge_platform
      SECRET_KEY: ${SECRET_KEY:?Set a generated SECRET_KEY in the root .env file}
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-ingestion}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      EMBEDDING_CACHE_TTL_SECONDS: ${EMBEDDING_CACHE_TTL_SECONDS:-86400}
      CACHE_MAX_VALUE_BYTES: ${CACHE_MAX_VALUE_BYTES:-524288}
      RQ_JOB_TIMEOUT: ${RQ_JOB_TIMEOUT:-900}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-local}
      OTEL_SERVICE_NAME: ai-knowledge-worker
      UPLOAD_DIR: /data/uploads
      EMBEDDING_CACHE_DIR: /data/models
      EMBEDDING_THREADS: ${EMBEDDING_THREADS:-2}
    volumes:
      - ingestion_data:/data
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    stop_grace_period: 16m

  research_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/knowledge_platform
      SECRET_KEY: ${SECRET_KEY:?Set a generated SECRET_KEY in the root .env file}
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_NAME: ${RESEARCH_QUEUE_NAME:-research}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      EMBEDDING_CACHE_TTL_SECONDS: ${EMBEDDING_CACHE_TTL_SECONDS:-86400}
      RETRIEVAL_CACHE_TTL_SECONDS: ${RETRIEVAL_CACHE_TTL_SECONDS:-300}
      CACHE_MAX_VALUE_BYTES: ${CACHE_MAX_VALUE_BYTES:-524288}
      RESEARCH_QUEUE_NAME: ${RESEARCH_QUEUE_NAME:-research}
      RESEARCH_JOB_TIMEOUT: ${RESEARCH_JOB_TIMEOUT:-3600}
      UPLOAD_DIR: /data/uploads
      EMBEDDING_CACHE_DIR: /data/models
      EMBEDDING_THREADS: ${EMBEDDING_THREADS:-2}
      RERANK_CACHE_DIR: /data/rerankers
      LLM_BASE_URL: ${LLM_BASE_URL:-http://localhost:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-}
      CHAT_MODEL: ${CHAT_MODEL:-}
      RESEARCH_PLAN_PROVIDER: ${RESEARCH_PLAN_PROVIDER:-}
      RESEARCH_PLAN_MODEL: ${RESEARCH_PLAN_MODEL:-}
      RESEARCH_DRAFT_PROVIDER: ${RESEARCH_DRAFT_PROVIDER:-}
      RESEARCH_DRAFT_MODEL: ${RESEARCH_DRAFT_MODEL:-}
      MODEL_FALLBACK_PROVIDER: ${MODEL_FALLBACK_PROVIDER:-}
      MODEL_FALLBACK_MODEL: ${MODEL_FALLBACK_MODEL:-}
      GATEWAY_MAX_ATTEMPTS: ${GATEWAY_MAX_ATTEMPTS:-2}
      GATEWAY_RETRY_BASE_SECONDS: ${GATEWAY_RETRY_BASE_SECONDS:-0.5}
      OPENAI_TOKEN_LIMIT_FIELD: ${OPENAI_TOKEN_LIMIT_FIELD:-max_tokens}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-local}
      OTEL_SERVICE_NAME: ai-knowledge-worker
    volumes:
      - ingestion_data:/data
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    stop_grace_period: 65m

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/knowledge_platform
      SECRET_KEY: ${SECRET_KEY:?Set a generated SECRET_KEY in the root .env file}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true

  dispatcher:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.dispatcher"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/knowledge_platform
      SECRET_KEY: ${SECRET_KEY:?Set a generated SECRET_KEY in the root .env file}
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-ingestion}
      RQ_JOB_TIMEOUT: ${RQ_JOB_TIMEOUT:-900}
      RESEARCH_QUEUE_NAME: ${RESEARCH_QUEUE_NAME:-research}
      RESEARCH_JOB_TIMEOUT: ${RESEARCH_JOB_TIMEOUT:-3600}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-local}
      OTEL_SERVICE_NAME: ai-knowledge-dispatcher
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.dispatcher", "--healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      - tempo

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - otel-collector
      - cadvisor

  tempo:
    image: grafana/tempo:3.0.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set a generated GRAFANA_ADMIN_PASSWORD in the root .env file}
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
      - tempo

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    command: ["--docker_only=true", "--housekeeping_interval=15s"]
    expose:
      - "8080"

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.4.1-4.5.0-ubuntu22.04
    profiles: [gpu]
    restart: unless-stopped
    cap_add: [SYS_ADMIN]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    expose:
      - "9400"

volumes:
  redis_data:
  postgres_data:
  ingestion_data:
  prometheus_data:
  tempo_data:
  grafana_data:
