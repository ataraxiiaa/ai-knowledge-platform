global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:9464]
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
  - job_name: dcgm-exporter
    static_configs:
      - targets: [dcgm-exporter:9400]
